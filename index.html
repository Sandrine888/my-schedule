<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的日程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="logo">我的日程</h1>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="home">首页</button>
        <button class="tab" data-tab="timetable">课表</button>
        <button class="tab" data-tab="todos">日程</button>
        <button class="tab" data-tab="checklist">待办</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="view-home" class="view active"></section>
    <section id="view-timetable" class="view"></section>
    <section id="view-todos" class="view"></section>
    <section id="view-checklist" class="view"></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-mask" data-action="close-modal"></div>
    <div class="modal-card">
      <h2 id="modal-title">添加日程</h2>
      <form id="todo-form">
        <label>标题 <span class="req">*</span>
          <input name="title" maxlength="50" required placeholder="例如：法语小组讨论">
        </label>
        <label>日期 <span class="req">*</span>
          <input name="date" type="date" required>
        </label>
        <div class="row">
          <label>开始时间
            <input name="start" type="time">
          </label>
          <label>结束时间
            <input name="end" type="time">
          </label>
        </div>
        <label>地点
          <input name="location" maxlength="40" placeholder="可选">
        </label>
        <label>备注
          <textarea name="notes" rows="2" maxlength="200" placeholder="可选"></textarea>
        </label>
        <p id="form-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-action="close-modal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="checklist-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-mask" data-action="close-checklist-modal"></div>
    <div class="modal-card">
      <h2 id="checklist-modal-title">添加待办</h2>
      <form id="checklist-form">
        <label>标题 <span class="req">*</span>
          <input name="title" maxlength="80" required placeholder="例如：买牛奶">
        </label>
        <p id="checklist-form-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-action="close-checklist-modal">取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/poems.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
